# This workflow validates documentation structure
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

name: Check SDK documentation

jobs:
  build:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Check documentation structure
      run: |
        echo "Checking documentation files..."
        test -f README.md && echo "✓ README.md exists"
        test -f examples/README.md && echo "✓ examples/README.md exists"
        test -f examples/requirements.txt && echo "✓ examples/requirements.txt exists"
        test -f CONTRIBUTING.md && echo "✓ CONTRIBUTING.md exists"
        echo "Documentation structure validated successfully!"