# This workflow will install Python dependencies and run linting
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

name: Testing

jobs:
  build:
    name: Linting and Validation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 requests
    - name: Lint with flake8
      run: |
        flake8 examples --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
    - name: Validate examples structure
      run: |
        python -c "import sys; import os; sys.path.insert(0, os.path.join(os.getcwd(), 'examples')); print('Examples structure validated')"
